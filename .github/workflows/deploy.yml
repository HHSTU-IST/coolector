name: Deploy to GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    # 变量缺失时**不部署**，但也不把流水线打红。
    # 原因：没有 VITE_RELAY_URL，产物会静默内联回落地址 http://127.0.0.1:8787 —— 那是
    # **访问者自己的机器**，页面能打开、却谁也连不上，属于「部署成功但功能全废」的静默失败。
    # 但本项目的 Relay 是「本机 + 隧道」形态（见 RECEIVER_SETUP.md），长期取不到稳定域名时
    # 让它持续飘红只会训练人忽略红色。折中：不发版，并把原因显式打在运行摘要与警告注解里。
    notice:
        if: vars.VITE_RELAY_URL == ''
        runs-on: ubuntu-latest
        steps:
            - name: 未配置 VITE_RELAY_URL —— 跳过 Pages 部署
              run: |
                  echo "::warning::未配置仓库变量 VITE_RELAY_URL —— 本次跳过 Pages 部署（线上保持上一版），这不是失败。"
                  {
                      echo "## 已跳过 Pages 部署"
                      echo ""
                      echo "仓库变量 VITE_RELAY_URL 为空。此时产物会内联回落地址 http://127.0.0.1:8787"
                      echo "（那是访问者自己的机器），发布出去等于一个谁也连不上的站点，因此本次不发布。"
                      echo ""
                      echo "恢复自动部署：仓库 Settings → Secrets and variables → Actions → Variables，"
                      echo "新建 VITE_RELAY_URL = 你的 Relay 稳定地址（如 https://relay.example.com，不含尾斜杠、不带路径），"
                      echo "然后重跑本工作流。"
                  } >> "$GITHUB_STEP_SUMMARY"

    build:
        if: vars.VITE_RELAY_URL != ''
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # 变量存在时仍校验形态：非法值会在运行期被前端拒绝并回落，等于白发一版。
            # 判据须与另两处**逐条一致**（改一处须同时改另两处）：
            #   - 构建守卫 scripts/check-no-secrets.mjs 的 assertRelayUrlLooksSafe()
            #   - 前端运行期 src/utils/relay.ts 的 RELAY_URL_PATTERN
            # 三者都只接受 http(s) 绝对地址（同域子路径写成 https://app.example.com/relay 仍可，
            # 裸相对路径 /relay 一律拒绝）。
            - name: Validate VITE_RELAY_URL
              env:
                  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
              run: |
                  case "$VITE_RELAY_URL" in
                      https://*) ;;
                      http://127.0.0.1*|http://localhost*) ;;
                      http://*)
                          echo "::warning::本站是 HTTPS，而 Relay 填的是 HTTP —— 浏览器会按混合内容拦截，请为 Relay 配 TLS。"
                          ;;
                      *)
                          echo "::error::VITE_RELAY_URL 必须是 http(s) 绝对地址，当前值为 '$VITE_RELAY_URL'（运行期也会拒绝这种值并回落到本机）。"
                          exit 1
                          ;;
                  esac

                  echo "前端将连接 Relay：$VITE_RELAY_URL"

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build project
              run: pnpm build
              env:
                  # 前端连接 Relay 的绝对地址（Vite 构建期注入）。
                  # 在仓库 Settings → Secrets and variables → Actions → Variables 里配置。
                  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
                  # ⚠️ 这里刻意不再注入任何**真实**密钥。
                  # 前端产物发布在公开的 GitHub Pages 上，任何 VITE_* 变量都会被内联进 dist/
                  # 并被访问者从 JS 中提取。接收端密钥改由用户在界面上填写、存本机 localStorage；
                  # 发送方（学生）不需要密钥 —— 房间号本身就是能力凭据。
                  #
                  # 下面这个 canary 是**公开的、非密钥**的固定串，用途与 CI 相同：
                  # 给守卫一个可核对的目标；若有人把构建期密钥读取加回来，产物里就会出现它。
                  VITE_RELAY_TOKEN: coolector-canary-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Guard against secret leakage in build output
              run: pnpm guard:no-secret
              env:
                  VITE_RELAY_TOKEN: coolector-canary-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "./dist"

    # build 被跳过时本 job 也会被跳过（needs 依赖被 skip ⇒ 依赖方 skip），
    # 因此「未配置变量」这一情况下不会有任何产物被发布。
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
