name: Deploy to GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build project
              run: pnpm build
              env:
                  # 前端连接 Relay 的绝对地址（Vite 构建期注入）。
                  # 在仓库 Settings → Secrets and variables → Actions → Variables 里配置。
                  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
                  # ⚠️ 这里刻意不再注入任何密钥。
                  # 前端产物发布在公开的 GitHub Pages 上，任何 VITE_* 变量都会被内联进 dist/
                  # 并被访问者从 JS 中提取。接收端密钥改由用户在界面上填写、存本机 localStorage；
                  # 发送方（学生）不需要密钥 —— 房间号本身就是能力凭据。

            - name: Guard against secret leakage in build output
              run: pnpm guard:no-secret

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "./dist"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
