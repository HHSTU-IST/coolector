name: Deploy to GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # 变量缺失时**故意失败**：没有它，产物会静默回落到 http://127.0.0.1:8787（访问者自己的机器），
            # 于是「部署成功」的公开站点其实连不上任何 Relay —— 这是最贵的静默失败形态。
            - name: Require VITE_RELAY_URL
              env:
                  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
              run: |
                  if [ -z "$VITE_RELAY_URL" ]; then
                      echo "::error::仓库变量 VITE_RELAY_URL 未配置 —— 产物会回落到 http://127.0.0.1:8787，线上连不上任何 Relay。"
                      echo "::error::修复：gh variable set VITE_RELAY_URL --repo ${{ github.repository }} --body 'https://relay.example.com'"
                      exit 1
                  fi

                  case "$VITE_RELAY_URL" in
                      https://*) ;;
                      http://127.0.0.1*|http://localhost*) ;;
                      http://*)
                          echo "::warning::本站是 HTTPS，而 Relay 填的是 HTTP —— 浏览器会按混合内容拦截，请为 Relay 配 TLS。"
                          ;;
                      *)
                          echo "::error::VITE_RELAY_URL 必须是 http(s) 绝对地址，当前值为 '$VITE_RELAY_URL'（运行期也会拒绝这种值并回落到本机）。"
                          exit 1
                          ;;
                  esac

                  echo "前端将连接 Relay：$VITE_RELAY_URL"

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build project
              run: pnpm build
              env:
                  # 前端连接 Relay 的绝对地址（Vite 构建期注入）。
                  # 在仓库 Settings → Secrets and variables → Actions → Variables 里配置。
                  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
                  # ⚠️ 这里刻意不再注入任何**真实**密钥。
                  # 前端产物发布在公开的 GitHub Pages 上，任何 VITE_* 变量都会被内联进 dist/
                  # 并被访问者从 JS 中提取。接收端密钥改由用户在界面上填写、存本机 localStorage；
                  # 发送方（学生）不需要密钥 —— 房间号本身就是能力凭据。
                  #
                  # 下面这个 canary 是**公开的、非密钥**的固定串，用途与 CI 相同：
                  # 给守卫一个可核对的目标；若有人把构建期密钥读取加回来，产物里就会出现它。
                  VITE_RELAY_TOKEN: coolector-canary-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Guard against secret leakage in build output
              run: pnpm guard:no-secret
              env:
                  VITE_RELAY_TOKEN: coolector-canary-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "./dist"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
