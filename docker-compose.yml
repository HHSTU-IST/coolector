# Coolector Relay Server —— 生产部署
# 用法：
#   cp .env.example .env   # 必须填写 RELAY_TOKEN（fail-closed：未设置将拒绝启动）
#   docker compose up -d --build
# 注意：RELAY_TOKEN 未设置时，容器内 Relay 因监听 0.0.0.0（非回环）会拒绝启动。
services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: coolector-relay:latest
    container_name: coolector-relay
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-*}
      # 处于可信反向代理（Nginx/Caddy 等）之后时必须设为 true，
      # 否则 Relay 生成的回调地址是 http://，浏览器会拦截混合内容，SSE 与按需拉正文同时失效
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      MAX_TEXT_BYTES: ${MAX_TEXT_BYTES:-1048576}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      # 单房间配额：防止免凭据的发送方把全局配额吃光、导致其它班级一起 507
      MAX_ROOM_UPLOAD_BYTES: ${MAX_ROOM_UPLOAD_BYTES:-134217728}
      MAX_ROOM_UPLOADS: ${MAX_ROOM_UPLOADS:-500}
      MAX_UPLOAD_NAME_BYTES: ${MAX_UPLOAD_NAME_BYTES:-255}
      ROOM_TTL_MS: ${ROOM_TTL_MS:-21600000}
      # 房间绝对存活上限：空闲 TTL 会被上传刷新，没有它就能靠「传 1 字节」永久占位
      ROOM_MAX_LIFETIME_MS: ${ROOM_MAX_LIFETIME_MS:-86400000}
      ROOM_CLEANUP_INTERVAL_MS: ${ROOM_CLEANUP_INTERVAL_MS:-1800000}
      # 默认回收重启后残留的「无主上传目录」（否则它们永久占额且无法回收）
      RELAY_KEEP_ORPHAN_UPLOADS: ${RELAY_KEEP_ORPHAN_UPLOADS:-false}
      STREAM_TICKET_TTL_MS: ${STREAM_TICKET_TTL_MS:-60000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      MAX_UPLOAD_BYTES_PER_WINDOW: ${MAX_UPLOAD_BYTES_PER_WINDOW:-268435456}
    volumes:
      - relay-uploads:/data/uploads

volumes:
  relay-uploads:
