# Coolector Relay Server —— 生产部署
# 用法：
#   cp .env.example .env   # 必须填写 RELAY_TOKEN（fail-closed：未设置将拒绝启动）
#   docker compose up -d --build
# 注意：RELAY_TOKEN 未设置时，容器内 Relay 因监听 0.0.0.0（非回环）会拒绝启动。
services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: coolector-relay:latest
    container_name: coolector-relay
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-*}
      # 处于可信反向代理（Nginx/Caddy 等）之后时必须设为 true，
      # 否则 Relay 生成的回调地址是 http://，浏览器会拦截混合内容，SSE 与按需拉正文同时失效
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      ROOM_TTL_MS: ${ROOM_TTL_MS:-21600000}
      STREAM_TICKET_TTL_MS: ${STREAM_TICKET_TTL_MS:-60000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    volumes:
      - relay-uploads:/data/uploads

volumes:
  relay-uploads:
